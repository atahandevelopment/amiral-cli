team:
  name: software-development-team

git:
  worktree_root: .amiral/worktrees
  cleanup_completed: true
  keep_failed: true
  keep_blocked: true
  keep_branches: true

execution:
  max_parallel_agents: 1
  lease_minutes: 30
  max_attempts: 3
  requests_directory: requests

providers:
  opencode:
    max_concurrency: 1

opencode:
  binary: opencode
  auto_approve: false

agents:

  lead:
    role: orchestrator
    skills:
      - general/git
      - general/clean-code

  planner:
    role: planner
    skills:
      - general/architecture
  devops:
    capabilities:
      - docker
      - ci
      - cd
      - github-actions
      - deployment

  frontend:
    role: developer
    capabilities:
      - frontend/nextjs
      - frontend/react
      - frontend/typescript
      - frontend/tailwind
      - frontend/storybook
      - frontend/tanstack-query
      - frontend/axios
      - frontend/astro
      - frontend/angular
      - frontend/vue
      - frontend/next-auth
      - frontend/next-i18next
      - frontend/next-seo
      - frontend/next-sitemap
      - frontend/next-pwa
      - frontend/schadcn
      - frontend/next-themes
      - frontend/material-ui
      - frontend/ant-design
    routing_priority: 10

  backend:
    role: developer
    capabilities:
      - backend/dotnet
      - backend/ef-core
      - backend/rest-api
      - backend/grpc
      - backend/graphql
      - backend/redis
      - backend/kafka
      - backend/rabbitmq
      - backend/docker
      - backend/kubernetes
      - backend/aws
      - backend/azure
      - backend/elasticsearch
      - backend/logging
      - backend/supabase
      - backend/stripe
      - backend/nestjs
      - backend/express
      - backend/fastify
      - backend/prisma
      - backend/typeorm
      - backend/mongodb
      - backend/mysql
      - backend/postgresql
      - backend/sqlite
      - backend/golang
      - backend/python
      - backend/java
      - backend/rust
      - backend/nodejs
    routing_priority: 10

  database:
    role: specialist
    capabilities:
      - database/postgresql
      - database/optimization
    routing_priority: 10

  reviewer:
    role: reviewer
    capabilities:
      - general/clean-code
      - general/security
      - code-review
      - architecture-review
      - security-review
    routing_priority: 10
  qa:
    role: tester
    capabilities:
      - testing/unit
      - testing/integration
      - testing/e2e
      - testing
      - regression
      - validation
    routing_priority: 10

workflows:

  feature:
    file: .opencode/workflows/feature.md

  bugfix:
    file: .opencode/workflows/bugfix.md

  refactor:
    file: .opencode/workflows/refactor.md